# Maya Paper — clock/date/password layout inspired by the former KooL lockscreen.
general {
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.cache/maya-lock/wallpaper
    color = rgb(dfdbc3)
    blur_size = 8
    blur_passes = 3
    noise = 0.005
    contrast = 0.9
    brightness = 1.0
    vibrancy = 0.0
}

# Crisp paper panel with Waybar-style bevels, without a blurred shadow.
shape {
    monitor =
    size = 560, 420
    color = rgb(f4f0e5)
    rounding = 12
    border_size = 2
    border_color = rgb(fffdf7) rgb(aa788c) 135deg
    shadow_passes = 0
    shadow_size = 8
    shadow_color = rgba(57433a55)
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgb(50313e)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 110
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = rgb(74675e)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    color = rgb(835f70)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -12
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 2
    outer_color = rgb(aa788c)
    inner_color = rgb(eee2e6)
    font_color = rgb(3b302c)
    check_color = rgb(819877)
    fail_color = rgb(b55b70)
    capslock_color = rgb(b48d54)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##8b8077">Password</span>
    fail_text = <span foreground="##9f435a">Try again ($ATTEMPTS)</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.25
    rounding = 8
    position = 0, -88
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(8b8077)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
    zindex = 1
}

# Raised paper footer: left.
shape {
    monitor =
    size = 430, 88
    color = rgb(f4f0e5)
    rounding = 7
    border_size = 2
    border_color = rgb(fffdf7) rgb(aa9588) 135deg
    shadow_passes = 0
    shadow_size = 5
    shadow_color = rgba(57433a44)
    position = 32, 32
    halign = left
    valign = bottom
    zindex = 0
}

# Raised paper footer: right.
shape {
    monitor =
    size = 320, 72
    color = rgb(f4f0e5)
    rounding = 7
    border_size = 2
    border_color = rgb(fffdf7) rgb(aa9588) 135deg
    shadow_passes = 0
    shadow_size = 5
    shadow_color = rgba(57433a44)
    position = -32, 32
    halign = right
    valign = bottom
    zindex = 0
}

label {
    monitor =
    text = cmd[update:10000] $HOME/.local/bin/maya-lock-info weather
    color = rgb(74675e)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 50, 50
    halign = left
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:10000] $HOME/.local/bin/maya-lock-info system
    color = rgb(835f70)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -50, 49
    halign = right
    valign = bottom
    zindex = 1
}
