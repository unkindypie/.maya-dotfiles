# Maya Paper Desktop — layered 90s dialog over the current wallpaper.
general {
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.cache/maya-lock/wallpaper
    color = rgb(dfdbc3)
    blur_size = 8
    blur_passes = 3
    noise = 0.005
    contrast = 0.9
    brightness = 1.0
    vibrancy = 0.0
}

# Offset shadow, backing sheet and raised dialog frame.
shape {
    monitor =
    size = 600, 480
    color = rgba(57433a38)
    rounding = 4
    border_size = 0
    border_color = rgb(fffdf7) rgb(aa9588) 135deg
    rotate = 0
    position = 10, -10
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 600, 480
    color = rgb(e7dccb)
    rounding = 4
    border_size = 2
    border_color = rgb(fffdf7) rgb(aa9588) 135deg
    rotate = 2
    position = -10, 7
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 600, 480
    color = rgb(f4f0e5)
    rounding = 4
    border_size = 3
    border_color = rgb(fffdf7) rgb(aa9588) 135deg
    rotate = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 2
}

