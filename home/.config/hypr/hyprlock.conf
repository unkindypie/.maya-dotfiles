# Maya Paper — clock/date/password layout inspired by the former KooL lockscreen.
general {
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.cache/maya-lock/wallpaper
    color = rgb(dfdbc3)
    blur_size = 8
    blur_passes = 3
    noise = 0.005
    contrast = 0.9
    brightness = 1.0
    vibrancy = 0.0
}

# Cream card with a rose outline and a soft paper shadow.
shape {
    monitor =
    size = 620, 470
    color = rgba(f4f0e5f5)
    rounding = 16
    border_size = 3
    border_color = rgb(a95878)
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(57433a44)
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgb(50313e)
    font_size = 78
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 128
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = rgb(74675e)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 45
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $USER
    color = rgb(835f70)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -16
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 400, 64
    outline_thickness = 2
    outer_color = rgb(a95878)
    inner_color = rgb(fffbf4)
    font_color = rgb(3b302c)
    check_color = rgb(819877)
    fail_color = rgb(b55b70)
    capslock_color = rgb(b48d54)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##8b8077">Password</span>
    fail_text = <span foreground="##9f435a">Try again ($ATTEMPTS)</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.25
    rounding = 8
    position = 0, -100
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(8b8077)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -174
    halign = center
    valign = center
    zindex = 1
}
