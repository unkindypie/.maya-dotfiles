source = $HOME/.config/maya-theme/colors.conf

# Maya Paper Desktop — layered 90s dialog over the current wallpaper.
general {
    immediate_render = true
}

background {
    monitor =
    path = $HOME/.cache/maya-lock/wallpaper
    color = $maya_novel_paper
    blur_size = 8
    blur_passes = 3
    noise = 0.005
    contrast = 0.9
    brightness = 1.0
    vibrancy = 0.0
}

# Offset shadow, backing sheet and raised dialog frame.
shape {
    monitor =
    size = 600, 480
    color = $maya_sheet_shadow
    rounding = 4
    border_size = 0
    border_color = $maya_bevel_white $maya_border 135deg
    rotate = 0
    position = 10, -10
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 600, 480
    color = $maya_backing_sheet
    rounding = 4
    border_size = 2
    border_color = $maya_bevel_white $maya_border 135deg
    rotate = 2
    position = -10, 7
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 600, 480
    color = $maya_paper
    rounding = 4
    border_size = 3
    border_color = $maya_bevel_white $maya_border 135deg
    rotate = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 2
}

# Pink title bar with a bevel, like a classic desktop dialog.
shape {
    monitor =
    size = 572, 42
    color = $maya_pink
    rounding = 4
    border_size = 2
    border_color = $maya_pink_highlight $maya_rose_border 135deg
    rotate = 0
    position = 0, 204
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = 󰌾  SESSION LOCKED
    color = $maya_selection_ink
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -130, 204
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = ●
    color = $maya_rose
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 258, 204
    halign = center
    valign = center
    zindex = 4
}

# Recessed clock display.
shape {
    monitor =
    size = 548, 138
    color = $maya_paper_white
    rounding = 4
    border_size = 2
    border_color = $maya_taupe $maya_bevel_white 135deg
    rotate = 0
    position = 0, 91
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = $maya_selection_ink
    font_size = 60
    font_family = JetBrainsMono Nerd Font
    position = 0, 109
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    color = $maya_muted_ink
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 43
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text =   $USER
    color = $maya_rose_ink
    font_size = 17
    font_family = JetBrainsMono Nerd Font
    position = 0, -28
    halign = center
    valign = center
    zindex = 4
}

shape {
    monitor =
    size = 408, 68
    color = $maya_paper_inset
    rounding = 4
    border_size = 2
    border_color = $maya_taupe $maya_bevel_white 135deg
    rotate = 0
    position = 0, -96
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 398, 58
    outline_thickness = 2
    outer_color = $maya_rose_border
    inner_color = $maya_password_pink
    font_color = $maya_ink
    check_color = $maya_success
    fail_color = $maya_failure
    capslock_color = $maya_caps_lock
    font_family = JetBrainsMono Nerd Font
    placeholder_text = $maya_password_placeholder
    fail_text = $maya_password_failure
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.25
    rounding = 3
    position = 0, -96
    halign = center
    valign = center
    zindex = 4
}

label {
    monitor =
    text = $LAYOUT
    color = $maya_faint_ink
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -156
    halign = center
    valign = center
    zindex = 4
}

shape {
    monitor =
    size = 548, 1
    color = $maya_divider
    rounding = 4
    border_size = 0
    border_color = $maya_bevel_white $maya_border 135deg
    rotate = 0
    position = 0, -183
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = Enter to unlock
    color = $maya_rose_ink
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -211
    halign = center
    valign = center
    zindex = 4
}

