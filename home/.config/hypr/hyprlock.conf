input-field {
    monitor =
    size = 398, 58
    outline_thickness = 2
    outer_color = rgb(aa788c)
    inner_color = rgb(eee2e6)
    font_color = rgb(3b302c)
    check_color = rgb(819877)
    fail_color = rgb(b55b70)
    capslock_color = rgb(b48d54)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##8b8077">Password</span>
    fail_text = <span foreground="##9f435a">Try again ($ATTEMPTS)</span>
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.25
    rounding = 3
    position = 0, -96
    halign = center
    valign = center
    zindex = 4
}

