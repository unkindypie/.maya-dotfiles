# Preserve the existing 9-minute warning and 10-minute lock timing.
general {
    lock_cmd = $HOME/.local/bin/maya-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout = 540
    on-timeout = notify-send "Taking a break?" "Your screen will lock in one minute."
    on-resume = notify-send "Welcome back"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
# Display-off and automatic suspend remain disabled, as before.
