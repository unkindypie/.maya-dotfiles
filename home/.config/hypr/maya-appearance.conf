# Raised paper sheets. Safe to source independently of KooL.
general {
    border_size = 2
    col.active_border = rgba(b77f92ff)
    col.inactive_border = rgba(b3a594ff)
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.08
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(57433a44)
        color_inactive = rgba(57433a14)
        offset = 0 3
    }
    blur {
        enabled = true
        size = 8
        passes = 3
    }
}
