source = $HOME/.config/maya-theme/colors.conf

# Raised paper sheets. Safe to source independently of KooL.
general {
    border_size = 2
    col.active_border = $maya_rose
    col.inactive_border = $maya_taupe
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.0
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = $maya_focus_shadow
        color_inactive = $maya_inactive_shadow
        offset = 0 3
    }
    blur {
        enabled = true
        size = 8
        passes = 3
    }
}

# Use a uniform 2px border to avoid resizing/jumping on focus changes.
