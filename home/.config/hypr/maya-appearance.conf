source = $HOME/.config/maya-theme/colors.conf

# Raised paper sheets. Safe to source independently of KooL.
general {
    border_size = 3
    col.active_border = $maya_rose $maya_pink $maya_lavender_border $maya_rose 45deg
    col.inactive_border = $maya_sage_border $maya_paper_inset $maya_taupe 135deg
}

decoration {
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.0
    shadow {
        enabled = true
        range = 26
        render_power = 2
        color = $maya_focus_shadow
        color_inactive = $maya_sheet_shadow
        offset = 0 5
    }
    blur {
        enabled = true
        size = 8
        passes = 3
        # Include compositor opacity when deciding where to blur.
        ignore_opacity = false
    }
}

# Use a uniform 3px border to avoid resizing/jumping on focus changes.

# Animate compositor opacity; only focused windows ignore app alpha.
# Keeping force_rgbx off when unfocused allows background blur to render.
windowrule = match:class .*, opacity 1.0 override 0.9 override 1.0 override
windowrule = match:focus true, force_rgbx on
animations {
    bezier = mayaOpacity, 0.22, 1, 0.36, 1
    animation = fadeSwitch, 1, 6, mayaOpacity
}
