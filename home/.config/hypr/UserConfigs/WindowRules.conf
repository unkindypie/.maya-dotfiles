# For window rules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


# Layer rules now belong in UserConfigs/LayerRules.conf


# Keep Vesktop call and screen-share windows opaque.
windowrule = match:class ^([Vv]esktop|dev\.vencord\.Vesktop)$, opacity 1.0 override 1.0 override 1.0 override
windowrule = match:class ^([Vv]esktop|dev\.vencord\.Vesktop)$, opaque on
windowrule = match:class ^([Vv]esktop|dev\.vencord\.Vesktop)$, no_blur on
