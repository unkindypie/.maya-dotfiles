# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME

##############
#  Rebinds   #
##############

# Screenshot a window
# bind = $mainMod, PRINT, exec, hyprshot -m window
# Screenshot a monitor/output
# bind = , PRINT, exec, hyprshot -m output
# Screenshot a drawn region
unbind = $mainMod, S, Web search, exec, $scriptsDir/RofiSearch.sh
bind = $mainMod, S, exec, $HOME/.local/bin/maya-screenshot -m region
unbind = $mainMod, I
bind = $mainMod, I, exec, google-chrome-stable
unbind = $mainMod, O
bind = $mainMod, O, exec, thunar


# --- Unbind Defaults to Prevent Conflicts ---
unbind = $mainMod SHIFT, left
unbind = $mainMod SHIFT, right
unbind = $mainMod SHIFT, up
unbind = $mainMod SHIFT, down

unbind = $mainMod CTRL, left
unbind = $mainMod CTRL, right
unbind = $mainMod CTRL, up
unbind = $mainMod CTRL, down

# --- New Swapped Keybinds ---

# Resize windows (Now using CTRL)
bindd = $mainMod CTRL, left, Resize left (-50), resizeactive, -50 0
bindd = $mainMod CTRL, right, Resize right (+50), resizeactive, 50 0
bindd = $mainMod CTRL, up, Resize up (-50), resizeactive, 0 -50
bindd = $mainMod CTRL, down, Resize down (+50), resizeactive, 0 50

# Move windows (Now using SHIFT)
bindd = $mainMod SHIFT, left, Move window left, movewindow, l
bindd = $mainMod SHIFT, right, Move window right, movewindow, r
bindd = $mainMod SHIFT, up, Move window up, movewindow, u
bindd = $mainMod SHIFT, down, Move window down, movewindow, d

bind = $mainMod, J, layoutmsg, togglesplit
unbind = $mainMod, F
bindd = $mainMod, F, Fullscreen, fullscreen
bindd = $mainMod, V, Float current window, togglefloating,


##############
#  unbinds   #
##############




# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
source = $UserConfigs/WorkSpaceRules.conf


# Override KooL browser shortcut with the personal paper lockscreen.
unbind = $mainMod, B
bindd = $mainMod, B, Lock screen, exec, $HOME/.local/bin/maya-lock

# Keep the familiar ranked launcher and mode tabs, with the personal theme.
unbind = $mainMod, D
bindd = $mainMod, D, Applications, exec, rofi -show drun -modi drun,filebrowser,run,window -config $HOME/.config/rofi/config.rasi

# Capture into the annotation editor; only save files explicitly.
unbind = ALT SHIFT, S
bindd = ALT SHIFT, S, Capture and annotate, exec, $HOME/.local/bin/maya-screenshot -m region
unbind = $mainMod, Print
bindd = $mainMod, Print, Capture and annotate, exec, $HOME/.local/bin/maya-screenshot -m output -m active
unbind = $mainMod SHIFT, Print
bindd = $mainMod SHIFT, Print, Capture and annotate, exec, $HOME/.local/bin/maya-screenshot -m region
unbind = $mainMod CTRL, Print
bindd = $mainMod CTRL, Print, Capture and annotate, exec, sleep 5 && $HOME/.local/bin/maya-screenshot -m output -m active
unbind = $mainMod CTRL SHIFT, Print
bindd = $mainMod CTRL SHIFT, Print, Capture and annotate, exec, sleep 10 && $HOME/.local/bin/maya-screenshot -m output -m active
unbind = ALT, Print
bindd = ALT, Print, Capture and annotate, exec, $HOME/.local/bin/maya-screenshot -m window -m active
unbind = $mainMod SHIFT, S
bindd = $mainMod SHIFT, S, Capture and annotate, exec, $HOME/.local/bin/maya-screenshot -m region
