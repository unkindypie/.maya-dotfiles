# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/maya-theme/colors.conf

general {
  border_size = 1
  gaps_in = 4
  gaps_out = 6

  col.active_border = $maya_rose
  col.inactive_border = $maya_sage_border
}

decoration {
  rounding = 10
  
  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = true
    range = 3
    render_power = 1

    color =  $maya_rose
    color_inactive = $maya_sage_border
  }

  blur {
    enabled = true
    size = 6
    passes = 3
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $maya_ansi_bright_white

	groupbar {
		col.active = $maya_fallback_dark
  }
}

# Personal focus treatment, after KooL defaults.
source = $HOME/.config/hypr/maya-appearance.conf
