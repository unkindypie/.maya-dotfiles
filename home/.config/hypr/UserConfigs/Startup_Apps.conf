# Commands and Apps to be executed at launch


# Personal session apps; exec-once runs at login, not config reload.
exec-once = vesktop
exec-once = Telegram
exec-once = google-chrome-stable --restore-last-session
# Only this startup terminal goes to workspace 2; later terminals stay local.
exec-once = [workspace 2 silent] kitty
